<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Instalatér Šomek">
  <rect width="64" height="64" rx="12" fill="#0b5fa5"/>
  <!-- White = tool, black = cut away: the open jaw and the hole in the handle end. -->
  <mask id="cut">
    <rect width="64" height="64" fill="#ffffff"/>
    <path d="M25.5 0 L25.5 13.5 Q25.5 15.5 27.5 15.5 L36.5 15.5 Q38.5 15.5 38.5 13.5 L38.5 0 Z" fill="#000000"/>
    <circle cx="32" cy="50" r="3.1" fill="#000000"/>
  </mask>
  <!-- Drawn head-up along the Y axis, then swung to the diagonal of the square. -->
  <g transform="rotate(45 32 32)" mask="url(#cut)" fill="#ffffff">
    <circle cx="32" cy="18" r="12"/>
    <path d="M27.6 18 L27.9 42 C27.9 46 25 46.5 25 50 L39 50 C39 46.5 36.1 46 36.1 42 L36.4 18 Z"/>
    <circle cx="32" cy="50" r="7"/>
  </g>
</svg>
